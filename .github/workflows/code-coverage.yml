name: Code Coverage

# Run on pushes to the default branch (to establish the baseline) and on pull requests (to compare against it). Code
# Quality compares the coverage of the PR branch to the default branch, so both triggers are needed.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  code-quality: write

# A new push to a pull request makes the running tests obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run pytest with coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Do not abort the other versions, if one fails, so that all failures are visible at once
      fail-fast: false
      matrix:
        # The supported versions, like in the pylint workflow. The coverage is only reported for the newest one.
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
      # Check out the PR head commit (not the merge commit) so coverage line numbers map correctly to the diff.
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies for testing
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --editable ".[test]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: >-
          matrix.python-version == '3.15' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
