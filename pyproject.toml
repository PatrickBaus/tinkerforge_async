[project]
name = "tinkerforge-async"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Python3 AsyncIO Tinkerforge driver"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
keywords = ["IoT", "Tinkerforge", "API"]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/tinkerforge_async"
"Bug Tracker" = "https://github.com/PatrickBaus/tinkerforge_async/issues"
"Download" = "https://github.com/PatrickBaus/tinkerforge_async/releases"

[project.optional-dependencies]
# Needed to run the test suite. pytest-cov measures the coverage, see the [tool.coverage] sections below.
test = [
    "pytest", "pytest-cov",
]
# Linters and type checkers. pylint also checks examples/ and tests/, so it needs the test dependencies.
lint = [
    "tinkerforge-async[test]",
    "black", "isort", "mypy", "pre-commit", "pylint", "setuptools",
]
# Building and publishing to PyPI
build = [
    "build", "twine",
]
# Building the documentation
doc = [
    "myst-parser", "sphinx",
]
# Everything needed for development
dev = [
    "tinkerforge-async[test,lint,build,doc]",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = "missing-class-docstring,missing-function-docstring"

[tool.pylint.'MAIN']
py-version = "3.12"
load-plugins = "pylint.extensions.docparams"
# Generated by setuptools-scm
ignore = ["_version.py"]

[tool.pylint.'MISCELLANEOUS']
notes = ["FIXME", "XXX",]

[tool.isort]
line_length = 120
profile = "black"
py_version = 312

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
# Require @typing.override on every overriding method, so that renaming a base method cannot silently break a subclass
enable_error_code = ["explicit-override"]

[tool.pytest.ini_options]
markers = [
    # conftest.py reorders tests moving slow ones to the end of the list
    "slow",
]

[tool.coverage.run]
# Measure from the root of the repository, so the paths in the report are relative to it and the lines can be mapped
# to the files of the checkout. Only the library is of interest, not the tests, the examples or the documentation.
source = ["."]
omit = ["tests/*", "examples/*", "doc/*", "setup.py", "tinkerforge_async/_version.py"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Only evaluated by the type checker
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Marks code after an endless loop, that only exists to tell mypy that the function does not return there
    "raise AssertionError",
]
# Every line and branch of the library must be covered by the tests
fail_under = 100

[build-system]
requires = [
    "setuptools>=84.0",
    "setuptools-scm>=8.0",  # for version_file
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The version is taken from the git tag of the release, e.g. 1.9.0. Commits after a tag get a development version
# like 1.9.1.dev3. The version is written to _version.py during the build. That file is not tracked by git.
version_file = "tinkerforge_async/_version.py"
# Leave out the "+g<commit hash>" local version part, which PyPI and TestPyPI reject
local_scheme = "no-local-version"
