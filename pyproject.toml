[project]
name = "tinkerforge-async"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Python3 AsyncIO Tinkerforge driver"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
keywords = ["IoT", "Tinkerforge", "API"]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/tinkerforge_async"
"Bug Tracker" = "https://github.com/PatrickBaus/tinkerforge_async/issues"
"Download" = "https://github.com/PatrickBaus/tinkerforge_async/releases"

[project.optional-dependencies]
dev = [
    "black", "build", "isort", "mypy", "pre-commit", "pylint", "setuptools", "twine",
]

doc = [
    "myst-parser", "sphinx",
]

test = [
    "mypy", "pylint", "pytest", "pytest-cov", "setuptools"
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = "missing-class-docstring,missing-function-docstring"

[tool.pylint.'MAIN']
load-plugins = "pylint.extensions.docparams"

[tool.pylint.'MISCELLANEOUS']
notes = ["FIXME", "XXX",]

[tool.isort]
line_length = 120
profile = "black"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
    # conftest.py reorders tests moving slow ones to the end of the list
    "slow",
]

[tool.coverage.run]
# Measure from the root of the repository, so the paths in the report are relative to it and the lines can be mapped
# to the files of the checkout. Only the library is of interest, not the tests, the examples or the documentation.
source = ["."]
omit = ["tests/*", "examples/*", "doc/*", "setup.py", "tinkerforge_async/_version.py"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Only evaluated by the type checker
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Marks code after an endless loop, that only exists to tell mypy that the function does not return there
    "raise AssertionError",
]
# Every line and branch of the library must be covered by the tests
fail_under = 100

[build-system]
requires = [
    "setuptools>=84.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "tinkerforge_async.__version__"}
